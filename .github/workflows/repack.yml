name: Fast Repack Lineage 22.2 Recovery (4.19 Kernel)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2
    paths:
      - 'prebuilts/boot_lin22.2_boots.img'
      - '.github/workflows/repack.yml'

permissions:
  contents: write

jobs:
  repack:
    name: Repack Boot Image (Lineage 22.2 + 4.19 Kernel)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            prebuilts
            .github
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Download Prebuilt 4.19 Kernel
        run: |
          curl -sL https://github.com/mobilist001-oss/android_kernel_nokia_sdm660_419/releases/download/PL2-4.19-v12/Image.gz-dtb -o Image.gz-dtb
          if [ ! -s Image.gz-dtb ]; then
            echo "Failed to download Image.gz-dtb" && exit 1
          fi
          ls -lh Image.gz-dtb

      - name: Unpack and Repack with Magiskboot
        run: |
          # Obtain native x86_64 magiskboot binary
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -o magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > ./magiskboot
          chmod +x ./magiskboot

          mkdir -p repack
          cd repack

          # Unpack known-working Lineage 22.2 boot image
          ../magiskboot unpack -h ../prebuilts/boot_lin22.2_boots.img || ../magiskboot unpack ../prebuilts/boot_lin22.2_boots.img

          # Replace kernel with our 4.19 Image.gz-dtb (with dual PL2/B2N DTBs)
          cp ../Image.gz-dtb kernel

          # Enable display panel (r69338) & FBCon onscreen console & permissive SELinux in cmdline
          if [ -f header ]; then
            sed -i 's/^cmdline=.*/& mdss_mdp.panel=1:dsi:0:fih,mdss_dsi_r69338_1080p_video:config0:1:none:cfg:single_dsi console=tty0 androidboot.selinux=permissive/' header
            cat header
          fi

          # Pre-arm ADB authentication & UDC controller binding in recovery ramdisk
          if [ -f ramdisk.cpio ]; then
            mkdir -p rd && cd rd
            cpio -idmv < ../ramdisk.cpio 2>/dev/null || true
            for p in prop.default default.prop system/etc/prop.default; do
              if [ -f "$p" ]; then
                printf "\nro.adb.secure=0\nro.debuggable=1\nro.secure=0\npersist.service.adb.enable=1\npersist.service.debuggable=1\npersist.sys.usb.config=adb\nsys.usb.config=adb\nsys.usb.configfs=1\nsys.usb.controller=a800000.dwc3\nro.recovery.usb.vid=18D1\nro.recovery.usb.adb.pid=D001\n" >> "$p"
              fi
            done
            printf "\nro.adb.secure=0\nro.debuggable=1\nro.secure=0\npersist.service.adb.enable=1\npersist.service.debuggable=1\npersist.sys.usb.config=adb\nsys.usb.config=adb\nsys.usb.configfs=1\nsys.usb.controller=a800000.dwc3\nro.recovery.usb.vid=18D1\nro.recovery.usb.adb.pid=D001\n" >> prop.default
            find . | cpio -H newc -o > ../ramdisk.cpio 2>/dev/null
            cd .. && rm -rf rd
          fi

          # Repack
          ../magiskboot repack ../prebuilts/boot_lin22.2_boots.img ../boot-4.19-PL2-lin22-recovery.img
          if [ ! -f ../boot-4.19-PL2-lin22-recovery.img ] && [ -f new-boot.img ]; then
            cp new-boot.img ../boot-4.19-PL2-lin22-recovery.img
          fi
          cd ..
          ls -lh boot-4.19-PL2-lin22-recovery.img

      - name: Upload Repacked Boot Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-4.19-PL2-lin22-recovery
          path: boot-4.19-PL2-lin22-recovery.img

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lin22-repack-v${{ github.run_number }}
          name: Nokia 6.1 (PL2) 4.19 Kernel + Lineage 22.2 Recovery #${{ github.run_number }}
          body: |
            ## Nokia 6.1 (PL2) 4.19 Kernel + Lineage 22.2 Recovery Repack
            
            ### Changes in this build:
            - **Base**: Proven LineageOS 22.2 Recovery (`boot_lin22.2_boots.img` matching working Slot B)
            - **Kernel**: CIP-LTS Linux 4.19.325 (`Image.gz-dtb` from PL2-4.19-v12 with dual PL2/B2N DTBs)
            - **Display Panel**: Configured for Renesas R69338 (`mdss_mdp.panel=1:dsi:0:fih,mdss_dsi_r69338_1080p_video:config0:1:none:cfg:single_dsi`)
            - **FBCon Onscreen Console**: Enabled (`console=tty0`)
            - **SELinux**: Permissive (`androidboot.selinux=permissive`)
            - **ADB**: Root & UDC hardware binding pre-armed (`sys.usb.controller=a800000.dwc3`)
          files: boot-4.19-PL2-lin22-recovery.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
