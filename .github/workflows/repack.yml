name: Fast Repack Dual Recovery (4.19 Kernel & Isolated PL2 DTB)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2
    paths:
      - 'prebuilts/**'
      - '.github/workflows/repack.yml'
      - '.github/scripts/**'

permissions:
  contents: write

jobs:
  repack:
    name: Repack Lineage 22.2 & 24.0 Recoveries (4.19 Kernel)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            prebuilts
            .github
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - name: Download Prebuilt 4.19 Kernel
        run: |
          curl -sL https://github.com/mobilist001-oss/android_kernel_nokia_sdm660_419/releases/download/PL2-4.19-v12/Image.gz-dtb -o Image.gz-dtb
          if [ ! -s Image.gz-dtb ]; then
            echo "Failed to download Image.gz-dtb" && exit 1
          fi
          ls -lh Image.gz-dtb

      - name: Repack Dual Recoveries (Lineage 22.2 & 24.0) with Magiskboot
        run: |
          # Obtain native x86_64 magiskboot binary
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -o magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > ./magiskboot
          chmod +x ./magiskboot

          # Build both recoveries: lin22 (Lineage 22.2) and lin24 (Lineage 24.0)
          for target in lin22 lin24; do
            echo "=========================================="
            echo "Repacking $target Recovery Image"
            echo "=========================================="

            if [ "$target" = "lin22" ]; then
              BASE_IMG="../prebuilts/boot_lin22.2_boots.img"
              OUT_IMG_NAME="boot-4.19-PL2-lin22-recovery.img"
            else
              BASE_IMG="../prebuilts/boot24.img"
              OUT_IMG_NAME="boot-4.19-PL2-lin24-recovery.img"
            fi

            WORKDIR="repack_$target"
            mkdir -p "$WORKDIR" && cd "$WORKDIR"

            # Unpack base boot image
            ../magiskboot unpack -h "$BASE_IMG" || ../magiskboot unpack "$BASE_IMG"

            # Replace kernel with full 4.19 Image.gz-dtb (containing full ABL-compatible DTB table)
            cp ../Image.gz-dtb kernel

            # Inject Renesas R69338 panel cmdline, FBCon onscreen console & permissive SELinux
            if [ -f header ]; then
              cmdline=$(grep '^cmdline=' header | cut -d= -f2-)
              for param in "mdss_mdp.panel=1:dsi:0:fih,mdss_dsi_r69338_1080p_video:config0:1:none:cfg:single_dsi" "console=tty0" "androidboot.selinux=permissive" "selinux=0" "enforcing=0"; do
                if ! echo "$cmdline" | grep -q "$param"; then
                  cmdline="$cmdline $param"
                fi
              done
              sed -i "s|^cmdline=.*|cmdline=$cmdline|" header
              echo "Updated cmdline in header:"
              cat header
            fi

            # Patch recovery ramdisk: un-disable adbd, set props, add failsafe dmesg dump service
            if [ -f ramdisk.cpio ]; then
              mkdir -p rd && cd rd
              cpio -idmv < ../ramdisk.cpio 2>/dev/null || true
              python3 ../../.github/scripts/patch_ramdisk.py .
              find . | cpio -H newc -o > ../ramdisk.cpio 2>/dev/null
              cd .. && rm -rf rd
            fi

            # Repack
            ../magiskboot repack "$BASE_IMG" "../$OUT_IMG_NAME"
            if [ ! -f "../$OUT_IMG_NAME" ] && [ -f new-boot.img ]; then
              cp new-boot.img "../$OUT_IMG_NAME"
            fi

            cd ..
            if [ ! -s "$OUT_IMG_NAME" ]; then
              echo "ERROR: Failed to produce $OUT_IMG_NAME" && exit 1
            fi
            ls -lh "$OUT_IMG_NAME"
          done

      - name: Upload Repacked Boot Image Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boot-4.19-PL2-dual-recoveries
          path: |
            boot-4.19-PL2-lin22-recovery.img
            boot-4.19-PL2-lin24-recovery.img

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lin-repack-v${{ github.run_number }}
          name: Nokia 6.1 (PL2) 4.19 Kernel + Dual Recovery Repack #${{ github.run_number }}
          body: |
            ## Nokia 6.1 (PL2) 4.19 Kernel Dual Recovery Repack

            ### Images Included:
            1. **`boot-4.19-PL2-lin22-recovery.img`**: LineageOS 22.2 Recovery + 4.19 Kernel
            2. **`boot-4.19-PL2-lin24-recovery.img`**: LineageOS 24.0 Recovery + 4.19 Kernel

            ### Flashing Instructions:
            Flash to `boot_a` (keeps Slot B intact as reference):
            ```bash
            fastboot flash boot_a boot-4.19-PL2-lin22-recovery.img
            ```
            **IMPORTANT (Booting Recovery on PL2)**:
            Do NOT boot via plain `fastboot reboot`. Disconnect cable or power off, then hold **Volume Up + Power** connected to USB until the phone vibrates into Recovery mode.
          files: |
            boot-4.19-PL2-lin22-recovery.img
            boot-4.19-PL2-lin24-recovery.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
