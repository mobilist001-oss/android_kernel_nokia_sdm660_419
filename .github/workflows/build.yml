name: Build Nokia 6.1 (PL2) 4.19 Kernel & Boot Image

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel & Repack Boot Image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libssl-dev libelf-dev lz4 python3 python-is-python3 libncurses-dev xz-utils zlib1g-dev cpio zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang

      - name: Build Kernel (Image.gz-dtb)
        run: |
          set -e -x -o pipefail
          export PATH=/usr/bin:$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"

          # Avoid warnings treated as errors in techpack audio under modern Clang
          find techpack/audio -type f \( -name "Kbuild" -o -name "Makefile" \) -exec sed -i 's/-Werror//g' {} +

          # Defconfig combination for PL2 (Nokia 6.1)
          make O=out \
            CC=clang \
            HOSTCC="gcc -B/usr/bin/" \
            HOSTCXX="g++ -B/usr/bin/" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/sdm660-perf_defconfig vendor/nokia/nokia.config vendor/nokia/B2N.config vendor/nokia/PL2.config

          # Compile
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC="gcc -B/usr/bin/" \
            HOSTCXX="g++ -B/usr/bin/" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" 2>&1 | tee build.log

      - name: Prepare AnyKernel3 Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=PL2/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=PL2_sprout/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=B2N/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name4=.*/device.name4=B2N_sprout/g' AnyKernel3/anykernel.sh

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Nokia_PL2_4.19-Kernel.zip * -x .git README.md
          cd ..

      - name: Isolate Strictly sdm630-mtp-pl2-dvt.dtb
        run: |
          python3 .github/scripts/isolate_dtb.py out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz-dtb-isolated sdm630-mtp-pl2-dvt.dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb-isolated sdm630-mtp-pl2-dvt.dtb

      - name: Repack Dual Recoveries (Lineage 22.2 & 24.0) with Magiskboot
        run: |
          # Obtain native x86_64 magiskboot binary
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -o magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > ./magiskboot
          chmod +x ./magiskboot

          for target in lin22 lin24; do
            echo "=========================================="
            echo "Repacking $target Recovery Image"
            echo "=========================================="

            if [ "$target" = "lin22" ]; then
              BASE_IMG="../prebuilts/boot_lin22.2_boots.img"
              OUT_IMG_NAME="boot-4.19-PL2-lin22-recovery.img"
            else
              BASE_IMG="../prebuilts/boot24.img"
              OUT_IMG_NAME="boot-4.19-PL2-lin24-recovery.img"
            fi

            WORKDIR="repack_$target"
            mkdir -p "$WORKDIR" && cd "$WORKDIR"

            # Unpack base boot image
            ../magiskboot unpack -h "$BASE_IMG" || ../magiskboot unpack "$BASE_IMG"

            # Replace kernel with 4.19 kernel containing strictly isolated sdm630-mtp-pl2-dvt.dtb
            cp ../out/arch/arm64/boot/Image.gz-dtb-isolated kernel

            # Inject Renesas R69338 panel cmdline, FBCon onscreen console & permissive SELinux
            if [ -f header ]; then
              cmdline=$(grep '^cmdline=' header | cut -d= -f2-)
              for param in "mdss_mdp.panel=1:dsi:0:fih,mdss_dsi_r69338_1080p_video:config0:1:none:cfg:single_dsi" "console=tty0" "androidboot.selinux=permissive"; do
                if ! echo "$cmdline" | grep -q "$param"; then
                  cmdline="$cmdline $param"
                fi
              done
              sed -i "s|^cmdline=.*|cmdline=$cmdline|" header
              echo "Updated cmdline in header:"
              cat header
            fi

            # Patch recovery ramdisk: un-disable adbd, set props, add failsafe dmesg dump service
            if [ -f ramdisk.cpio ]; then
              mkdir -p rd && cd rd
              cpio -idmv < ../ramdisk.cpio 2>/dev/null || true
              python3 ../../.github/scripts/patch_ramdisk.py .
              find . | cpio -H newc -o > ../ramdisk.cpio 2>/dev/null
              cd .. && rm -rf rd
            fi

            # Repack
            ../magiskboot repack "$BASE_IMG" "../$OUT_IMG_NAME"
            if [ ! -f "../$OUT_IMG_NAME" ] && [ -f new-boot.img ]; then
              cp new-boot.img "../$OUT_IMG_NAME"
            fi

            cd ..
            if [ ! -s "$OUT_IMG_NAME" ]; then
              echo "ERROR: Failed to produce $OUT_IMG_NAME" && exit 1
            fi
            ls -lh "$OUT_IMG_NAME"
          done

      - name: Extract & Display Build Errors
        if: failure()
        run: |
          mkdir -p build_logs
          echo "### ❌ Build Failed — Error Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            grep -iE "error:|fatal error:|recipe for target.*failed" build.log | tail -n 50 > build_logs/errors_summary.txt || true
            cat build_logs/errors_summary.txt >> $GITHUB_STEP_SUMMARY
            gzip -c build.log > build_logs/build.log.gz
          else
            echo "No build.log found" > build_logs/errors_summary.txt
            cat build_logs/errors_summary.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build_logs/

      - name: Publish Failure Logs to Release
        if: failure() && github.ref == 'refs/heads/lineage-23.2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failure-v${{ github.run_number }}
          name: ❌ Build Failure Logs #${{ github.run_number }}
          body: |
            ## ❌ Kernel Build Failed on Run #${{ github.run_number }}
            Attached is `errors_summary.txt` and full compressed `build.log.gz`.
          files: |
            build_logs/errors_summary.txt
            build_logs/build.log.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-PL2-4.19-Build-Artifacts
          path: |
            boot-4.19-PL2-lin22-recovery.img
            boot-4.19-PL2-lin24-recovery.img
            sdm630-mtp-pl2-dvt.dtb
            Nokia_PL2_4.19-Kernel.zip
            out/arch/arm64/boot/Image.gz-dtb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/lineage-23.2'
        with:
          tag_name: PL2-4.19-v${{ github.run_number }}
          name: Nokia 6.1 (PL2) 4.19 Kernel & Dual Recovery Images #${{ github.run_number }}
          body: |
            ## Nokia 6.1 (PL2 / B2N ABL) Kernel 4.19 Bringup Build

            ### Artifacts included:
            - **`boot-4.19-PL2-lin22-recovery.img`**: Standalone boot image combining LineageOS 22.2 Recovery ramdisk (matches reference Slot B) + 4.19.325 Kernel with strictly isolated PL2 DVT DTB.
            - **`boot-4.19-PL2-lin24-recovery.img`**: Standalone boot image combining LineageOS 24.0 Recovery ramdisk + 4.19.325 Kernel with strictly isolated PL2 DVT DTB.
            - **`sdm630-mtp-pl2-dvt.dtb`**: Isolated hardware DTB for Nokia 6.1 PL2 DVT board.
            - **`Nokia_PL2_4.19-Kernel.zip`**: AnyKernel3 flashable package for Recovery/TWRP.
            - **`Image.gz-dtb`**: Raw kernel binary with appended device tree blobs.

            **Commit**: `${{ github.sha }}`
          files: |
            boot-4.19-PL2-lin22-recovery.img
            boot-4.19-PL2-lin24-recovery.img
            sdm630-mtp-pl2-dvt.dtb
            Nokia_PL2_4.19-Kernel.zip
            out/arch/arm64/boot/Image.gz-dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
