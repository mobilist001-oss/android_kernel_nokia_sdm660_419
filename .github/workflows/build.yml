name: Build Nokia 6.1 (PL2) 4.19 Kernel & Boot Image

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

permissions:
  contents: write

jobs:
  build:
    name: Build Kernel & Repack Boot Image
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git libssl-dev libelf-dev lz4 python3 python-is-python3 libncurses-dev xz-utils zlib1g-dev cpio zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang

      - name: Build Kernel (Image.gz-dtb)
        run: |
          set -e -x -o pipefail
          export PATH=/usr/bin:$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-Wno-error"

          # Avoid warnings treated as errors in techpack audio under modern Clang
          find techpack/audio -type f \( -name "Kbuild" -o -name "Makefile" \) -exec sed -i 's/-Werror//g' {} +

          # Defconfig combination for PL2 (Nokia 6.1)
          make O=out \
            CC=clang \
            HOSTCC="gcc -B/usr/bin/" \
            HOSTCXX="g++ -B/usr/bin/" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            vendor/sdm660-perf_defconfig vendor/nokia/nokia.config vendor/nokia/PL2.config

          # Compile
          make -j$(nproc --all) O=out \
            CC=clang \
            HOSTCC="gcc -B/usr/bin/" \
            HOSTCXX="g++ -B/usr/bin/" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-Wno-error" 2>&1 | tee build.log

      - name: Prepare AnyKernel3 Package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's/device.name1=.*/device.name1=PL2/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=PL2_sprout/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name3=.*/device.name3=Plate2/g' AnyKernel3/anykernel.sh

          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || cp out/arch/arm64/boot/Image.gz AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Nokia_PL2_4.19-Kernel.zip * -x .git README.md
          cd ..

      - name: Repack Boot Image (LineageOS 22.2 Recovery + 4.19 Kernel)
        run: |
          mkdir -p repack
          cd repack

          # Obtain native x86_64 magiskboot binary
          curl -sL https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk -o magisk.zip
          unzip -p magisk.zip lib/x86_64/libmagiskboot.so > ./magiskboot
          chmod +x ./magiskboot

          # Unpack stock working Lineage 22.2 boot image
          ./magiskboot unpack ../prebuilts/boot_lin22.2_boots.img

          # Replace kernel with 4.19 Image.gz-dtb
          cp ../out/arch/arm64/boot/Image.gz-dtb kernel

          # Enable FBCon onscreen console in boot cmdline
          sed -i 's/^cmdline=.*/& console=tty0/' header

          # Pre-arm ADB authentication & root debugging in recovery ramdisk
          mkdir -p rd && cd rd
          cpio -idmv < ../ramdisk.cpio
          for p in prop.default default.prop system/etc/prop.default; do
            if [ -f "$p" ]; then
              printf "\nro.adb.secure=0\nro.debuggable=1\nro.secure=0\npersist.service.adb.enable=1\npersist.service.debuggable=1\npersist.sys.usb.config=adb\n" >> "$p"
            fi
          done
          printf "\nro.adb.secure=0\nro.debuggable=1\nro.secure=0\npersist.service.adb.enable=1\npersist.service.debuggable=1\npersist.sys.usb.config=adb\n" >> prop.default
          find . | cpio -H newc -o > ../ramdisk.cpio
          cd .. && rm -rf rd

          # Repack
          ./magiskboot repack ../prebuilts/boot_lin22.2_boots.img ../boot-4.19-PL2-recovery.img
          cd ..

      - name: Extract & Display Build Errors
        if: failure()
        run: |
          mkdir -p build_logs
          echo "### ❌ Build Failed — Error Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f build.log ]; then
            grep -iE "error:|fatal error:|recipe for target.*failed" build.log | tail -n 50 > build_logs/errors_summary.txt || true
            cat build_logs/errors_summary.txt >> $GITHUB_STEP_SUMMARY
            gzip -c build.log > build_logs/build.log.gz
          else
            echo "No build.log found" > build_logs/errors_summary.txt
            cat build_logs/errors_summary.txt >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: build_logs/

      - name: Publish Failure Logs to Release
        if: failure() && github.ref == 'refs/heads/lineage-23.2'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: failure-v${{ github.run_number }}
          name: ❌ Build Failure Logs #${{ github.run_number }}
          body: |
            ## ❌ Kernel Build Failed on Run #${{ github.run_number }}
            Attached is `errors_summary.txt` and full compressed `build.log.gz`.
          files: |
            build_logs/errors_summary.txt
            build_logs/build.log.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Nokia-PL2-4.19-Build-Artifacts
          path: |
            boot-4.19-PL2-recovery.img
            Nokia_PL2_4.19-Kernel.zip
            out/arch/arm64/boot/Image.gz-dtb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && github.ref == 'refs/heads/lineage-23.2'
        with:
          tag_name: PL2-4.19-v${{ github.run_number }}
          name: Nokia 6.1 (PL2) 4.19 Kernel & Recovery Boot Image #${{ github.run_number }}
          body: |
            ## Nokia 6.1 (PL2) Kernel 4.19 Bringup Build

            ### Artifacts included:
            - **`boot-4.19-PL2-recovery.img`**: Standalone boot image combining LineageOS 22.2 Recovery ramdisk + 4.19.325 CIP-LTS Kernel (`fastboot boot boot-4.19-PL2-recovery.img`).
            - **`Nokia_PL2_4.19-Kernel.zip`**: AnyKernel3 flashable package for Recovery/TWRP.
            - **`Image.gz-dtb`**: Raw kernel binary with appended device tree blob.

            **Commit**: `${{ github.sha }}`
          files: |
            boot-4.19-PL2-recovery.img
            Nokia_PL2_4.19-Kernel.zip
            out/arch/arm64/boot/Image.gz-dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
